# Prometheus for the FraudShield compose stack (profile: monitoring).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: stream-workers
    static_configs:
      - targets: ["processor:9100", "gateway:9100", "label-emitter:9100", "parquet-sink:9100", "shadow:9100"]
  - job_name: prefect-worker # drift job results (mlops profile)
    static_configs:
      - targets: ["prefect-worker:9100"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
