name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint-test:
    name: lint + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Tests (unit + parity + smoke)
        run: make test PYTEST_ARGS="--junitxml=pytest-report.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  ui:
    name: ui (typecheck + vitest + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    name: docker build (api)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image (linux/amd64; multi-arch push happens in cd.yml, Phase 8)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fraudshield-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and reports healthy (no model mounted -> not ready)
        run: |
          docker run -d --name api -p 8000:8000 fraudshield-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = "503"
          docker rm -f api

  integration:
    name: compose integration (core profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v7
      - name: Start the core stack and run integration tests
        # dev bundles (fixture-trained), compose up --wait, pytest -m integration in the test
        # container on the compose network
        run: make test-integration
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile core logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: make down-v
