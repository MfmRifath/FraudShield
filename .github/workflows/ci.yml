name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  HYPOTHESIS_PROFILE: ci

# Actions are pinned by commit SHA (tag in the comment); Dependabot proposes updates.
jobs:
  lint-test:
    name: lint + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Tests (unit + parity + smoke)
        run: make test PYTEST_ARGS="--junitxml=pytest-report.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  ui:
    name: ui (typecheck + vitest + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    name: docker build (api)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build API image (linux/amd64; multi-arch images are built by cd.yml)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: fraudshield-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Container starts and reports healthy (no model mounted -> not ready)
        run: |
          docker run -d --name api -p 8000:8000 fraudshield-api:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = "503"
          docker rm -f api

  demo:
    name: demo container (one command, < 1 GiB)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Start the demo at 50 tx/s
        run: FS_DEMO_RATE=50 docker compose -f compose.demo.yml up -d --build --wait
      - name: UI + API up, memory under 1 GiB for 2 minutes
        run: uv run --frozen --no-default-groups python scripts/demo_check.py --minutes 2 --out demo-check
      - name: Demo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: demo-check
          path: demo-check/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.demo.yml logs --no-color --tail=200

  integration:
    name: compose integration (core profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Start the core stack and run integration tests
        # dev bundles (fixture-trained), compose up --wait, pytest -m integration in the test
        # container on the compose network
        run: make test-integration
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile core logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: make down-v
