# FraudShield base configuration (16 GB "full" profile).
# Override per environment with FRAUDSHIELD_CONFIG=configs/<profile>.yaml
# or individual keys with env vars, e.g. FRAUDSHIELD_PATHS__DATA_RAW=/mnt/raw.
env: dev
log_level: INFO
seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  manifests: data/manifests
  reports: reports
  fixtures: tests/fixtures
  costs: configs/costs.yaml
  rules: configs/rules.yaml
  tuned_params: configs/tuned
  model_card: docs/model_card.md

# Active dataset for `make data` / `make features` (override: DATASET=sparkov or FRAUDSHIELD_DATASET).
dataset: ieee_cis

# Labels become known a deterministic, hash(txn_id)-derived delay after the event (ADR-0005).
# max_days must not exceed any dataset's split gap_days (validated).
labels:
  delay:
    kind: uniform
    min_days: 1.0
    max_days: 7.0
    seed: 17

features:
  target_encoding_smoothing: 50.0

training:
  # MLflow >= 3.13 refuses plain file stores; local runs use SQLite + a local artifact dir.
  # The compose `mlops` profile overrides this with the MLflow server (FRAUDSHIELD_TRAINING__MLFLOW_TRACKING_URI).
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_artifact_location: mlartifacts
  experiment: fraudshield
  registered_model: fraudshield
  categorical_min_count: 20
  platt_below_positives: 1000
  lgbm:
    num_leaves: 63
    learning_rate: 0.05
    num_boost_round: 2000
    early_stopping_rounds: 100
    min_child_samples: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    scale_pos_weight: 1.0
    num_threads: 0
  tune:
    n_trials: 40

serving:
  # "bundle": load artifacts/<ds>/bundle (demo, tests); "mlflow": models:/fraudshield@champion.
  model_source: bundle
  dataset: ieee_cis
  bundle_dir: artifacts/ieee_cis/bundle
  champion_uri: models:/fraudshield@champion
  challenger_uri: models:/fraudshield@challenger
  load_challenger: true
  canary_pct: 0            # % of uids (stable hash) routed to @challenger
  feature_timeout_ms: 10
  breaker_failure_threshold: 5
  breaker_reset_s: 30
  update_store_inline: true   # false when the stream processor updates the store (Phase 4)
  publish_queue_size: 10000
  sse_queue_size: 1000
  # admin_token: set FRAUDSHIELD_SERVING__ADMIN_TOKEN to enable POST /admin/reload

datasets:
  ieee_cis:
    kaggle_handle: ieee-fraud-detection
    kaggle_kind: competition
    license: "Kaggle competition rules (non-redistributable)"
    # Synthetic timestamp assumption: event_time = origin + TransactionDT seconds (ADR-0004).
    origin: "2017-12-01T00:00:00Z"
    splits:
      train: {start: 1, end: 120}
      val: {start: 128, end: 150}
      test: {start: 158, end: 183}
      gap_days: 7
      cv_folds: 3
      cv_val_days: 14
      cv_min_train_days: 30
    # Request-time passthrough numeric columns (become x_<lowercase name>).
    # Initial selection; revisited in Phase 2 with importance on the validation window.
    extra_columns: [
      card1, card2, card3, card5, addr2, dist1,
      C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14,
      D1, D2, D3, D4, D10, D11, D15,
      V1, V3, V4, V6, V8, V11, V258, V283, V294, V307, V317,
    ]
  sparkov:
    kaggle_handle: kartik2112/fraud-detection
    kaggle_kind: dataset
    license: CC0-1.0
    # trans_date_trans_time is interpreted as UTC; day 1 = 2019-01-01.
    origin: "2018-12-31T00:00:00Z"
    splits:
      train: {start: 1, end: 500}
      val: {start: 508, end: 530}
      test: {start: 538, end: 731}
      gap_days: 7
      cv_folds: 3
      cv_val_days: 28
      cv_min_train_days: 60
    extra_columns: [city_pop, lat, long, merch_lat, merch_long]
