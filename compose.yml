# FraudShield local stack.
#   make up         -> profile "core": redpanda, console, redis, api, processor + stream workers
#   make up-mlops   -> + profile "mlops": postgres, mlflow, prefect-server, prefect-worker
#   make up-all     -> + profile "monitoring": prometheus (:9090), grafana (:3000)
#   make up-ui      -> + profile "ui": analyst UI (nginx :5180; /api proxied to the API)
# Every service has a healthcheck and a memory limit; all images are multi-arch (amd64/arm64).
# Images: local builds by default; FS_IMAGE_PREFIX=ghcr.io/<owner>/ FS_TAG=<sha> pulls the CD images
# instead (docker compose pull; see docs/deploy/arm-vm.md).
# Host ports are overridable: FS_KAFKA_PORT, FS_REDIS_PORT (6380), FS_MLFLOW_PORT (5050; macOS AirPlay
# holds 5000), FS_PG_PORT (5433), FS_PREFECT_PORT, FS_API_PORT, FS_CONSOLE_PORT, ...

name: fraudshield

x-app: &app
  image: ${FS_IMAGE_PREFIX:-}fraudshield-api:${FS_TAG:-dev}
  build: .
  restart: unless-stopped
  volumes:
    - ./artifacts:/app/artifacts:ro
  environment: &app-env
    FRAUDSHIELD_CONFIG: /app/configs/base.yaml
    FRAUDSHIELD_LOG_LEVEL: INFO
    # Until the real training run, the stack serves dev bundles trained on the CC0 fixture.
    FRAUDSHIELD_SERVING__DATASET: ${FS_DATASET:-sparkov}
    FRAUDSHIELD_DATASET: ${FS_DATASET:-sparkov}
    # bundle (default) | mlflow: serve models:/fraudshield@champion from the mlops profile
    FRAUDSHIELD_SERVING__MODEL_SOURCE: ${FS_MODEL_SOURCE:-bundle}
    FRAUDSHIELD_TRAINING__MLFLOW_TRACKING_URI: http://mlflow:5000
    FRAUDSHIELD_TRAINING__MLFLOW_ARTIFACT_LOCATION: ""
    FRAUDSHIELD_SERVING__BUNDLE_DIR: /app/artifacts/${FS_BUNDLE_SET:-dev}/bundle
    FRAUDSHIELD_SERVING__CHALLENGER_BUNDLE_DIR: /app/artifacts/${FS_BUNDLE_SET:-dev}/challenger
    FRAUDSHIELD_SERVING__FEATURE_STORE: redis
    FRAUDSHIELD_SERVING__PUBLISHER: kafka
    FRAUDSHIELD_SERVING__UPDATE_STORE_INLINE: "false"
    # 10 ms budget; the integration targets relax it: they test feature correctness, not latency
    FRAUDSHIELD_SERVING__FEATURE_TIMEOUT_MS: ${FS_FEATURE_TIMEOUT_MS:-10}
    FRAUDSHIELD_SERVING__ADMIN_TOKEN: ${FS_ADMIN_TOKEN:-change-me-locally}
    FRAUDSHIELD_STREAMING__BOOTSTRAP_SERVERS: redpanda:9092
    FRAUDSHIELD_STREAMING__REDIS_URL: redis://redis:6379/0
    FRAUDSHIELD_STREAMING__API_URL: http://api:8000
    FRAUDSHIELD_STREAMING__PARQUET_DIR: /data/stream
    FRAUDSHIELD_STREAMING__PARQUET_FLUSH_S: "5"
    MLFLOW_DISABLE_AGENT_HINT: "1"
    # review cases + analyst labels: memory (core only) | postgres (make up-mlops / up-all set it)
    FRAUDSHIELD_CASES__STORE: ${FS_CASE_STORE:-memory}
    FRAUDSHIELD_CASES__DSN: postgresql://fraudshield:${FS_PG_PASSWORD:-fraudshield}@postgres:5432/fraudshield

x-worker-health: &worker-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    profiles: [core]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${FS_KAFKA_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${FS_KAFKA_PORT:-19092}:19092"
      - "${FS_REDPANDA_ADMIN_PORT:-9644}:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 1536m
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    profiles: [core]
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        for t in transactions.raw transactions.truth decisions labels shadow.scores; do
          rpk topic create $$t -p 3 -r 1 -X brokers=redpanda:9092 || true;
        done; rpk topic list -X brokers=redpanda:9092
    restart: "no"
    mem_limit: 128m

  console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    profiles: [core]
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${FS_CONSOLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/admin/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  redis:
    image: redis:8.10.2-alpine
    profiles: [core]
    # noeviction: silently evicting feature history would corrupt features; a failed write
    # degrades the API visibly instead. Ephemeral by design (no persistence).
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "${FS_REDIS_PORT:-6380}:6379"  # 6380 on the host: 6379 is often taken by another Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 640m

  api:
    <<: *app
    profiles: [core]
    depends_on:
      redis: { condition: service_healthy }
      topics-init: { condition: service_completed_successfully }
      # only when the mlops profile is up (FS_CASE_STORE=postgres); ignored otherwise
      postgres: { condition: service_healthy, required: false }
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./reports:/app/reports:ro  # latest drift report for the analyst UI
    ports:
      - "${FS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 768m

  processor:
    <<: *app
    profiles: [core]
    command: ["python", "-m", "fraudshield.streaming", "processor"]
    depends_on:
      redis: { condition: service_healthy }
      topics-init: { condition: service_completed_successfully }
    ports:
      - "9101:9100"
    healthcheck: *worker-health
    mem_limit: 384m

  gateway:
    <<: *app
    profiles: [core]
    command: ["python", "-m", "fraudshield.streaming", "gateway"]
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "9102:9100"
    healthcheck: *worker-health
    mem_limit: 256m

  label-emitter:
    <<: *app
    profiles: [core]
    command: ["python", "-m", "fraudshield.streaming", "label-emitter"]
    depends_on:
      topics-init: { condition: service_completed_successfully }
    ports:
      - "9103:9100"
    healthcheck: *worker-health
    mem_limit: 256m

  parquet-sink:
    <<: *app
    profiles: [core]
    command: ["python", "-m", "fraudshield.streaming", "parquet-sink"]
    depends_on:
      topics-init: { condition: service_completed_successfully }
    volumes:
      - ./artifacts:/app/artifacts:ro
      - stream-data:/data/stream
    ports:
      - "9104:9100"
    healthcheck: *worker-health
    mem_limit: 384m

  shadow:
    <<: *app
    profiles: [core]
    command: ["python", "-m", "fraudshield.streaming", "shadow"]
    depends_on:
      topics-init: { condition: service_completed_successfully }
    ports:
      - "9105:9100"
    healthcheck: *worker-health
    mem_limit: 512m

  # ---------------------------------------------------------------- mlops profile
  postgres:
    image: postgres:18.6-alpine
    profiles: [mlops]
    environment:
      POSTGRES_USER: fraudshield
      POSTGRES_PASSWORD: ${FS_PG_PASSWORD:-fraudshield}
      POSTGRES_DB: fraudshield
    volumes:
      - pg-data:/var/lib/postgresql  # Postgres 18 layout: mount the parent of the versioned dir
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${FS_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield -d fraudshield"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  mlflow:
    image: ${FS_IMAGE_PREFIX:-}fraudshield-mlflow:${FS_TAG:-dev}
    build: infra/mlflow
    profiles: [mlops]
    depends_on:
      postgres: { condition: service_healthy }
    command:
      - mlflow
      - server
      - --backend-store-uri=postgresql+psycopg2://fraudshield:${FS_PG_PASSWORD:-fraudshield}@postgres:5432/mlflow
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      - --host=0.0.0.0
      - --port=5000
      - --workers=1  # each worker loads the full app (~0.5 GB); one is plenty locally
      # MLflow 3.x only accepts localhost/private-IP Host headers by default (DNS-rebinding guard)
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,localhost:${FS_MLFLOW_PORT:-5050}
    environment:
      # MLflow 3.x starts ~7 background job consumers (GenAI eval/optimisation, ~150 MB each);
      # tracking + registry do not need them.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "${FS_MLFLOW_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g

  prefect-server:
    image: prefecthq/prefect:3.8.8-python3.12
    profiles: [mlops]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://fraudshield:${FS_PG_PASSWORD:-fraudshield}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:${FS_PREFECT_PORT:-4200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "${FS_PREFECT_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g

  prefect-worker:
    <<: *app
    image: ${FS_IMAGE_PREFIX:-}fraudshield-trainer:${FS_TAG:-dev}
    build:
      context: .
      target: trainer
    profiles: [mlops]
    command: ["python", "-m", "fraudshield.flows", "serve"]
    depends_on:
      prefect-server: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    environment:
      <<: *app-env
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_RUNNER_SERVER_ENABLE: "true"
      PREFECT_RUNNER_SERVER_HOST: 0.0.0.0
      PREFECT_RUNNER_SERVER_PORT: "8080"
      FRAUDSHIELD_MLOPS__API_URL: http://api:8000
      # the drift job retrains with this flow; mlops-demo (synthetic) until the real training run
      FRAUDSHIELD_MONITORING__RETRAIN_FLOW: ${FS_RETRAIN_FLOW:-mlops-demo}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - worker-artifacts:/app/artifacts
      - ./artifacts/dev:/app/artifacts/dev:ro   # champion bundle the drift job monitors
      - stream-data:/data/stream:ro             # served-traffic log written by parquet-sink
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 3g

  # ---------------------------------------------------------------- monitoring profile
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports:
      - "${FS_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${FS_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-slos.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${FS_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  # ---------------------------------------------------------------- ui profile
  ui:
    image: ${FS_IMAGE_PREFIX:-}fraudshield-ui:${FS_TAG:-dev}
    build: ui
    profiles: [ui]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${FS_UI_PORT:-5180}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m

volumes:
  redpanda-data:
  stream-data:
  pg-data:
  mlflow-artifacts:
  worker-artifacts:
  prom-data:
  grafana-data:
