[project]
name = "fraudshield"
version = "0.1.0"
description = "Real-time fraud detection service: PIT-correct features, LightGBM, cost-aware policy, streaming, MLOps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "FraudShield maintainers" }]
# Exact pins only (ADR-0002). Core = data pipeline + serving runtime (what the API image installs);
# training-only libraries live in the `train` dependency group (ADR-0009).
dependencies = [
    "confluent-kafka==2.12.2",
    "duckdb==2.0.0",
    "fastapi==0.162.0",
    "httptools==0.9.0",
    "lightgbm==4.7.0",
    "mlflow-skinny==3.17.2",
    "numpy==2.5.4",
    "orjson==3.13.0",
    "pandera==0.34.1",
    "polars==2.0.0",
    "prometheus-client==0.26.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "quixstreams==3.28.1",
    "redis==8.1.0",
    "requests==2.34.2",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
]

[project.scripts]
fraudshield = "fraudshield.cli:main"

[dependency-groups]
train = [
    "matplotlib==3.11.2",
    "mlflow==3.17.2",
    "optuna==5.0.0",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
]
data = [
    "kagglehub==1.0.3",
]
dev = [
    "fakeredis==2.40.0",
    "httpx2==2.16.0",
    "hypothesis==6.170.8",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "types-pyyaml==6.0.12.20260906",
]
notebooks = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield"]

[tool.uv]
required-version = ">=0.12.23,<0.13"
default-groups = ["dev", "data", "train"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["ui", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # naming
    "PTH",      # pathlib over os.path
    "DTZ",      # timezone-aware datetimes (event_time correctness)
    "PT",       # pytest style
    "S",        # bandit
    "RUF",
    "TID",      # tidy imports
    "NPY",      # numpy
]
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"notebooks/**" = ["S101", "E402"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["kagglehub", "kagglehub.*", "confluent_kafka", "confluent_kafka.*", "lightgbm", "lightgbm.*", "sklearn", "sklearn.*", "shap", "shap.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest (native TOML, pytest>=9)
[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
markers = [
    "unit: fast, pure tests (no I/O beyond tmp_path)",
    "parity: online vs offline feature parity",
    "smoke: small end-to-end training/serving runs",
    "integration: requires docker compose services",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "error",
    # third-party noise (keep each entry narrow and justified):
    # mlflow emits this from its own GenAI type hints at import time
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
    # mlflow's SQLAlchemy tracking store uses a loader option deprecated in SQLAlchemy 2.1
    "ignore:.*``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
    # mlflow 3.17 input-example serialisation compares columns to range() (pandas 3 deprecation)
    "ignore:Operation with range is deprecated:pandas.errors.Pandas4Warning:mlflow.models.utils",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["fraudshield"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
