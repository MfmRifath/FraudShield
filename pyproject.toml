[project]
name = "fraudshield"
version = "0.1.0"
description = "Real-time fraud detection service: PIT-correct features, LightGBM, cost-aware policy, streaming, MLOps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "FraudShield maintainers" }]
# Exact pins only. Heavy ML/infra deps are added in the phase that first needs them (ADR-0002).
dependencies = [
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pandera==0.34.1",
    "polars==2.0.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
]

[project.scripts]
fraudshield = "fraudshield.cli:main"

[dependency-groups]
data = [
    "kagglehub==1.0.3",
]
dev = [
    "hypothesis==6.170.8",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "types-pyyaml==6.0.12.20260906",
]
notebooks = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield"]

[tool.uv]
required-version = ">=0.12.23,<0.13"
default-groups = ["dev", "data"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["ui", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # naming
    "PTH",      # pathlib over os.path
    "DTZ",      # timezone-aware datetimes (event_time correctness)
    "PT",       # pytest style
    "S",        # bandit
    "RUF",
    "TID",      # tidy imports
    "NPY",      # numpy
]
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"notebooks/**" = ["S101", "E402"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["kagglehub", "kagglehub.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest (native TOML, pytest>=9)
[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
markers = [
    "unit: fast, pure tests (no I/O beyond tmp_path)",
    "parity: online vs offline feature parity",
    "smoke: small end-to-end training/serving runs",
    "integration: requires docker compose services",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["fraudshield"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
